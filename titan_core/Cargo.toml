[package]
name = "titan_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "titan_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
candle-core = "0.8.2"
candle-nn = "0.8.2"
pyo3 = { version = "0.23.3", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
half = { version = "2.3", features = ["num-traits", "use-intrinsics"] }
rand = "0.8"
tokenizers = "0.21.0"

[dev-dependencies]
candle-datasets = "0.8.2"
